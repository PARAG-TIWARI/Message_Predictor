name: Message Predictor CI

on:
  pull_request:
    branches: [main]
    paths:
      - "app.py"
      - "setup.sh"
      - "requirements.txt"
      - "model.pkl"
      - "vectorizer.pkl"
      - "tests/**"
      - ".github/workflows/message-predictor-ci.yml"
  push:
    branches: [main]
    paths:
      - "app.py"
      - "setup.sh"
      - "requirements.txt"
      - "model.pkl"
      - "vectorizer.pkl"
      - "tests/**"
      - ".github/workflows/message-predictor-ci.yml"

permissions:
  contents: read

jobs:
  streamlit-smoke:
    name: Streamlit model and prediction smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install application and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Install NLTK resources
        run: |
          python -m nltk.downloader -d "$HOME/.nltk_data" punkt punkt_tab stopwords

      - name: Run application smoke test
        run: pytest -q
